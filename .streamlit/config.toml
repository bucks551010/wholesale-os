[theme]
base = "dark"
primaryColor = "#f97316"
backgroundColor = "#08090d"
secondaryBackgroundColor = "#111319"
textColor = "#e4e6eb"
font = "sans serif"

[server]
headless = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true
